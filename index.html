<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SYRA SANTOS | SALES ARCHITECT</title>
  
  <!-- Google Font: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* Premium Color Palette & Tokens */
    :root {
      --primary-navy: #183A73;      /* Core Brand Accent & Hero Text */
      --secondary-navy: #365A8C;    /* Muted Text / Job Title / Location */
      --soft-bg: #F4F6F9;           /* Viewport Background */
      --card-bg: #FCFCFC;           /* Ultra-subtle Off-White Card Surface */
      --light-gray: #E8E8E8;        /* Soft Dividers & Containers */
      --border-line: #D8D8D8;        /* Understated Divider Line */
      --text-muted: #8E9BAE;        /* Subtle Labels */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--soft-bg);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 32px 20px;
    }

    /* Architectural Card Container */
    .card-container {
      background-color: var(--card-bg);
      border-radius: 36px;
      width: 100%;
      max-width: 380px;
      padding: 44px 32px 36px;
      text-align: center;
      box-shadow: 0 12px 32px rgba(24, 58, 115, 0.04);
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid rgba(232, 232, 232, 0.8);
    }

    /* Company Logo */
    .company-logo {
      margin-top: 4px;
      margin-bottom: 32px;
    }

    .logo-main {
      font-size: 1.15rem;
      letter-spacing: -0.02em;
      color: var(--primary-navy);
      line-height: 1;
    }

    .logo-main .bold-part {
      font-weight: 800;
    }

    .logo-main .light-part {
      font-weight: 400;
    }

    .logo-sub {
      font-size: 0.48rem;
      font-weight: 600;
      letter-spacing: 0.42em;
      color: var(--primary-navy);
      text-transform: uppercase;
      margin-top: 6px;
      text-align: center;
      padding-left: 0.42em;
    }

    /* Individual Name */
    h1 {
      font-size: 1.65rem;
      font-weight: 700;
      color: var(--primary-navy);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 6px;
      line-height: 1.15;
    }

    /* Job Title */
    .title {
      font-size: 0.72rem;
      color: var(--secondary-navy);
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    /* Understated Thin Divider */
    .divider-line {
      height: 1px;
      width: 28px;
      background-color: var(--border-line);
      margin-bottom: 22px;
    }

    /* Contact Details */
    .info-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
      width: 100%;
    }

    .info-link {
      font-size: 0.84rem;
      font-weight: 500;
      color: var(--primary-navy);
      text-decoration: none;
      letter-spacing: 0.01em;
      transition: opacity 0.2s ease;
      word-break: break-all;
      line-height: 1.4;
    }

    .info-link:hover {
      opacity: 0.7;
    }

    /* Location */
    .location {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--secondary-navy);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    /* High-Readability Extra Large QR Code Section */
    .qr-section {
      background-color: #FFFFFF;
      padding: 18px;
      border-radius: 24px;
      display: inline-block;
      box-shadow: 0 8px 24px rgba(24, 58, 115, 0.06);
      border: 1px solid var(--light-gray);
      margin-bottom: 32px;
    }

    .qr-section img {
      display: block;
      width: 190px;
      height: 190px;
    }

    /* Footer - Authorized Systems */
    .partner-section {
      width: 100%;
      border-top: 1px solid var(--light-gray);
      padding-top: 20px;
    }

    .partner-label {
      font-size: 0.58rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 12px;
      opacity: 0.75;
    }

    .partner-logos {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 24px;
    }

    .partner-brand {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      color: var(--primary-navy);
      text-transform: uppercase;
    }

    .partner-bullet {
      font-size: 0.6rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="card-container">
    
    <!-- Company Logo Header -->
    <div class="company-logo">
      <div class="logo-main"><span class="bold-part">diversified</span><span class="light-part">source</span></div>
      <div class="logo-sub">INCORPORATED</div>
    </div>

    <!-- Name & Title -->
    <h1>SYRA SANTOS</h1>
    <p class="title">SALES ARCHITECT</p>
    
    <!-- Understated Divider -->
    <div class="divider-line"></div>

    <!-- Contact Info -->
    <div class="info-group">
      <a href="tel:09432441266" class="info-link">0943 244 1266</a>
      <a href="https://www.diversifiedsourceinc.com/" target="_blank" rel="noopener" class="info-link">www.diversifiedsourceinc.com</a>
    </div>

    <!-- Location -->
    <div class="location">
      MAKATI | PHILIPPINES
    </div>

    <!-- Enhanced QR Code (190px Large Format) -->
    <div class="qr-section">
      <img src="https://quickchart.io/qr?text=BEGIN%3AVCARD%0AVERSION%3A3.0%0AN%3ASantos%3BSyra%0AFN%3ASyra+Santos%0AORG%3ADiversifiedsource+Inc.%0ATITLE%3ASales+Architect%0ATEL%3A09432441266%0AURL%3Ahttps%3A%2F%2Fwww.diversifiedsourceinc.com%2F%0AADR%3A%3B%3BMakati%3B%3B%3BPhilippines%0AEND%3AVCARD&size=190" alt="Scan to Save Contact">
    </div>

    <!-- Footer Grid -->
    <div class="partner-section">
      <div class="partner-label">AUTHORIZED SYSTEMS</div>
      <div class="partner-logos">
        <span class="partner-brand">RENSON</span>
        <span class="partner-bullet">•</span>
        <span class="partner-brand">OTIIMA</span>
        <span class="partner-bullet">•</span>
        <span class="partner-brand">CENTOR</span>
      </div>
    </div>

  </div>

</body>
</html>
